<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cocok Gambar Ceria 5x5</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        :root {
            --sat: env(safe-area-inset-top, 10px);
            --sab: env(safe-area-inset-bottom, 20px);
            --sal: env(safe-area-inset-left, 10px);
            --sar: env(safe-area-inset-right, 10px);
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, #FFF9C4 0%, #E1F5FE 100%);
            font-family: 'Fredoka One', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        #game-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding-top: calc(var(--sat) + 8px);
            padding-bottom: calc(var(--sab) + 55px); /* Safe zone navigasi bawah HP */
            padding-left: calc(var(--sal) + 10px);
            padding-right: calc(var(--sar) + 10px);
        }

        /* Header UI */
        #header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pill-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 14px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            color: #0288D1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 2px solid #FFF;
        }

        .home-btn {
            background: #FFD166;
            border: 2px solid #FFF;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        /* Board Wrapper */
        #board-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            background: #FFFFFF;
            border-radius: 22px;
            padding: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border: 4px solid #FFD166;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #grid-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
        }

        /* Card Tile */
        .tile {
            background: #F0F4F8;
            border: 2.5px solid #CBD5E1;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(24px, 7vw, 34px);
            cursor: pointer;
            box-shadow: 0 4px 0px #CBD5E1;
            transition: transform 0.08s ease, background-color 0.15s ease;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0px #CBD5E1;
        }

        .tile.selected {
            background: #FFD166 !important;
            border-color: #FF9F1C !important;
            box-shadow: 0 0 12px #FF9F1C;
            transform: scale(1.06);
        }

        .tile.hinted {
            animation: pulseHint 0.6s infinite alternate;
        }

        @keyframes pulseHint {
            from { background: #C7F9CC; border-color: #57CC99; }
            to { background: #80ED99; border-color: #38A3A5; }
        }

        .tile.empty {
            visibility: hidden;
            pointer-events: none;
        }

        /* Footer Control Buttons */
        #controls-box {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            flex: 1;
            background: #FF4081;
            color: white;
            border: 3px solid #FFF;
            padding: 10px 14px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .ctrl-btn.secondary {
            background: #0288D1;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        /* Overlays (Start & Ending) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(225, 245, 254, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .overlay.hidden {
            display: none !important;
        }

        .overlay-card {
            background: white;
            padding: 25px 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 5px solid #FFD166;
            width: 92%;
            max-width: 360px;
        }

        .title {
            font-size: 26px;
            color: #0288D1;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }

        .menu-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-height: 280px;
            overflow-y: auto;
            padding: 4px;
        }

        .level-btn {
            background: #FF4081;
            color: white;
            border: 3px solid #FFF;
            padding: 12px 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .level-btn:active {
            transform: scale(0.96);
        }

        @keyframes correctPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(0); }
        }

        .anim-correct {
            animation: correctPop 0.3s ease forwards;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Header -->
    <div id="header">
        <button class="home-btn" id="homeBtn" title="Menu Utama">🏠 Menu</button>
        <div class="pill-box" id="levelDisplay">Lvl 1: Hewan</div>
        <div class="pill-box" id="starDisplay">⭐ 0</div>
    </div>

    <!-- Board 5x5 Area -->
    <div id="board-wrapper">
        <div id="grid-container"></div>
    </div>

    <!-- Bottom Controls -->
    <div id="controls-box">
        <button class="ctrl-btn" id="hintBtn">💡 Bantuan</button>
        <button class="ctrl-btn secondary" id="shuffleBtn">🔄 Acak</button>
    </div>

    <!-- Screen Menu Pilih Level (1-10) -->
    <div id="start-overlay" class="overlay">
        <div class="overlay-card">
            <div style="font-size: 55px; margin-bottom: 5px;">🧩 Cocok Gambar 🧩</div>
            <div class="title">Pilih Level</div>
            <div class="subtitle">Klik 2 gambar yang sama!</div>
            
            <div class="menu-btn-group" id="levelBtnContainer"></div>
        </div>
    </div>

    <!-- Screen Kemenangan / Tamat Level -->
    <div id="win-overlay" class="overlay hidden">
        <div class="overlay-card">
            <div style="font-size: 60px; margin-bottom: 8px;">🏆</div>
            <div class="title" style="color: #00BFA5;" id="winTitle">LEVEL SELESAI!</div>
            <div class="subtitle" id="winSubtitle">Pintar sekali, kamu berhasil mencocokkan semua gambar! 🎉</div>
            
            <div class="menu-btn-group">
                <button class="level-btn" id="nextLevelBtn" style="justify-content: center;">LEVEL SELANJUTNYA ➡️</button>
                <button class="level-btn" id="winHomeBtn" style="background: #0288D1; justify-content: center;">MENU UTAMA 🏠</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Database 10 Level Bertema
    const levelsData = [
        { level: 1, name: 'Hewan', theme: ['🐱','🐶','🐰','🐹','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐸'] },
        { level: 2, name: 'Benda', theme: ['🎒','✏️','🔑','⏰','👓','🔦','🎈','🎁','☂️','📱','🚗','⚽'] },
        { level: 3, name: 'Buah', theme: ['🍎','🍌','🍊','🍓','🍇','🍉','🍍','🍑','🍒','🥝','🥑','🍈'] },
        { level: 4, name: 'Sayur', theme: ['🥦','🥕','🌽','🥒','🍅','🍆','🥔','🍄','🫑','🧅','🧄','🥗'] },
        { level: 5, name: 'Kendaraan', theme: ['🚗','🚌','🚑','🚒','✈️','🚀','🚢','🚂','🚁','🚜','🛵','🚲'] },
        { level: 6, name: 'Makanan', theme: ['🍕','🍔','🍟','🌭','🍿','🍩','🍦','🍰','🥨','🌮','🍣','🍳'] },
        { level: 7, name: 'Bentuk & Simbol', theme: ['⭐','🔴','🟦','🔺','💛','💎','🟢','🟨','💜','⬛','🔶','⚪'] },
        { level: 8, name: 'Ekspresi Wajah', theme: ['😀','😂','😍','🥳','🤪','🤩','🤓','😷','👻','🤖','👽','😺'] },
        { level: 9, name: 'Hobi & Alam', theme: ['🎨','🎸','⚽','🏀','Fishing','🏕️','🌺','🌈','☀️','🌙','🌲','🌊'] },
        { level: 10, name: 'Super Combo', theme: ['🐱','🍎','🚗','🍕','🚀','⭐','🐻','🍓','🚌','🍩','🔴','🎨'] }
    ];

    const ROWS = 5;
    const COLS = 5;

    let currentLevelIdx = 0;
    let stars = 0;
    let board = []; // Matriks 5x5 (0 = kosong, 1-12 = ID gambar)
    let selectedTile = null; // {r, c}
    let isProcessing = false;

    let audioCtx = null;

    // DOM Elements
    const gridContainer = document.getElementById('grid-container');
    const startOverlay = document.getElementById('start-overlay');
    const winOverlay = document.getElementById('win-overlay');
    const levelBtnContainer = document.getElementById('levelBtnContainer');
    const levelDisplay = document.getElementById('levelDisplay');
    const starDisplay = document.getElementById('starDisplay');

    const hintBtn = document.getElementById('hintBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const homeBtn = document.getElementById('homeBtn');
    const nextLevelBtn = document.getElementById('nextLevelBtn');
    const winHomeBtn = document.getElementById('winHomeBtn');
    const winTitle = document.getElementById('winTitle');

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'match') {
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, now + (idx * 0.06));
                    g.gain.setValueAtTime(0.3, now + (idx * 0.06));
                    g.gain.exponentialRampToValueAtTime(0.01, now + (idx * 0.06) + 0.15);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(now + (idx * 0.06)); o.stop(now + (idx * 0.06) + 0.15);
                });
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + (idx * 0.1));
                    g.gain.setValueAtTime(0.4, now + (idx * 0.1));
                    g.gain.exponentialRampToValueAtTime(0.01, now + (idx * 0.1) + 0.3);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(now + (idx * 0.1)); o.stop(now + (idx * 0.1) + 0.3);
                });
            }
        } catch (e) {}
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    // Inisialisasi Papan 5x5
    function initBoard() {
        board = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));

        // 24 Kartu (12 Pasang ID 1-12) + 1 Slot Kosong di Tengah
        let pairs = [];
        for (let i = 1; i <= 12; i++) {
            pairs.push(i, i);
        }
        pairs.sort(() => Math.random() - 0.5);

        let pairIdx = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (r === 2 && c === 2) {
                    board[r][c] = 0; // Posisi tengah dibuat terbuka
                } else {
                    board[r][c] = pairs[pairIdx++];
                }
            }
        }

        renderGrid();
    }

    function renderGrid() {
        gridContainer.innerHTML = '';
        const theme = levelsData[currentLevelIdx].theme;

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const tileVal = board[r][c];
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.r = r;
                tile.dataset.c = c;

                if (tileVal === 0) {
                    tile.classList.add('empty');
                } else {
                    tile.innerText = theme[tileVal - 1] || '❓';
                    tile.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        onTileClick(r, c);
                    });
                }
                gridContainer.appendChild(tile);
            }
        }
    }

    function onTileClick(r, c) {
        if (isProcessing || board[r][c] === 0) return;
        initAudio();
        clearHints();

        if (!selectedTile) {
            // Pilih Kartu Pertama
            selectedTile = { r, c };
            getTileElem(r, c)?.classList.add('selected');
            playSound('select');
        } else if (selectedTile.r === r && selectedTile.c === c) {
            // Batal Pilih jika Kartu Sama Ditekan Ulang
            getTileElem(r, c)?.classList.remove('selected');
            selectedTile = null;
        } else {
            // Pilih Kartu Kedua
            const r1 = selectedTile.r, c1 = selectedTile.c;
            const r2 = r, c2 = c;

            // KUNCI SEDERHANA: Jika Gambar Sama -> LANGSUNG COCOK!
            if (board[r1][c1] === board[r2][c2]) {
                isProcessing = true;
                const el1 = getTileElem(r1, c1);
                const el2 = getTileElem(r2, c2);

                el2?.classList.add('selected');
                playSound('match');

                el1?.classList.add('anim-correct');
                el2?.classList.add('anim-correct');

                setTimeout(() => {
                    board[r1][c1] = 0;
                    board[r2][c2] = 0;

                    el1?.classList.add('empty');
                    el2?.classList.add('empty');
                    el1?.classList.remove('selected', 'anim-correct');
                    el2?.classList.remove('selected', 'anim-correct');

                    selectedTile = null;
                    isProcessing = false;

                    stars += 10;
                    starDisplay.innerText = `⭐ ${stars}`;

                    if (isBoardClear()) {
                        onLevelComplete();
                    }
                }, 300);

            } else {
                // Gambar Berbeda -> Beralih Seleksi ke Kartu Baru
                playSound('wrong');
                getTileElem(selectedTile.r, selectedTile.c)?.classList.remove('selected');
                selectedTile = { r, c };
                getTileElem(r, c)?.classList.add('selected');
            }
        }
    }

    function getTileElem(r, c) {
        return gridContainer.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    }

    function isBoardClear() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] !== 0) return false;
            }
        }
        return true;
    }

    function clearHints() {
        gridContainer.querySelectorAll('.tile').forEach(t => t.classList.remove('hinted'));
    }

    // Fungsi Bantuan (Menemukan 2 Gambar Sama yang Tersisa)
    function giveHint() {
        initAudio();
        clearHints();

        let tiles = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] !== 0) {
                    tiles.push({ r, c, val: board[r][c] });
                }
            }
        }

        for (let i = 0; i < tiles.length; i++) {
            for (let j = i + 1; j < tiles.length; j++) {
                if (tiles[i].val === tiles[j].val) {
                    playSound('select');
                    getTileElem(tiles[i].r, tiles[i].c)?.classList.add('hinted');
                    getTileElem(tiles[j].r, tiles[j].c)?.classList.add('hinted');
                    return;
                }
            }
        }
    }

    // Fungsi Acak Kartu
    function manualShuffle() {
        initAudio();
        playSound('select');
        clearHints();

        if (selectedTile) {
            getTileElem(selectedTile.r, selectedTile.c)?.classList.remove('selected');
            selectedTile = null;
        }

        let activeVals = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] !== 0) {
                    activeVals.push(board[r][c]);
                }
            }
        }

        activeVals.sort(() => Math.random() - 0.5);

        let idx = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] !== 0) {
                    board[r][c] = activeVals[idx++];
                }
            }
        }

        renderGrid();
    }

    function onLevelComplete() {
        playSound('win');
        winOverlay.classList.remove('hidden');

        if (currentLevelIdx < levelsData.length - 1) {
            winTitle.innerText = "LEVEL SELESAI!";
            winSubtitle.innerText = `Pintar sekali, kamu berhasil menyelesaikan Level ${levelsData[currentLevelIdx].level}! 🎉`;
            nextLevelBtn.style.display = "flex";
            speakText(`Hore! Level ${levelsData[currentLevelIdx].level} selesai! Kamu hebat sekali!`);
        } else {
            winTitle.innerText = "🏆 SELAMAT! TAMAT! 🏆";
            winSubtitle.innerText = "Luar biasa, kamu sudah menyelesaikan SEMUA 10 LEVEL! 🎉";
            nextLevelBtn.style.display = "none";
            speakText("Hore! Luar biasa, kamu berhasil menamatkan semua level!");
        }
    }

    function renderLevelMenu() {
        levelBtnContainer.innerHTML = '';
        levelsData.forEach((lvl, idx) => {
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            btn.innerHTML = `<span>Lvl ${lvl.level}: ${lvl.name}</span> <span>${lvl.theme[0]}</span>`;
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                startLevel(idx);
            });
            levelBtnContainer.appendChild(btn);
        });
    }

    function startLevel(idx) {
        initAudio();
        currentLevelIdx = idx;
        selectedTile = null;
        isProcessing = false;

        levelDisplay.innerText = `Lvl ${levelsData[idx].level}: ${levelsData[idx].name}`;
        startOverlay.classList.add('hidden');
        winOverlay.classList.add('hidden');

        initBoard();
        speakText(`Level ${levelsData[idx].level}, ${levelsData[idx].name}`);
    }

    function showMainMenu() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        startOverlay.classList.remove('hidden');
        winOverlay.classList.add('hidden');
    }

    // Event Listeners
    hintBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); giveHint(); });
    shuffleBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); manualShuffle(); });

    homeBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); showMainMenu(); });
    winHomeBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); showMainMenu(); });

    nextLevelBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (currentLevelIdx < levelsData.length - 1) {
            startLevel(currentLevelIdx + 1);
        }
    });

    // Initial setup
    renderLevelMenu();
</script>
</body>
</html>
