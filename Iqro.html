<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Buku Iqro 1 Digital</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        :root {
            --sat: env(safe-area-inset-top, 10px);
            --sab: env(safe-area-inset-bottom, 20px);
            --sal: env(safe-area-inset-left, 10px);
            --sar: env(safe-area-inset-right, 10px);
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #EFEBE9;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        #game-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding-top: calc(var(--sat) + 6px);
            padding-bottom: calc(var(--sab) + 55px); /* Zona Aman Navigasi Bawah HP */
            padding-left: calc(var(--sal) + 10px);
            padding-right: calc(var(--sar) + 10px);
        }

        /* 1. Header Utama */
        #header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pill-box {
            background: #FFF;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #C62828;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            border: 2px solid #D32F2F;
        }

        /* 2. Tombol Navigasi Atas (Pindah dari Bawah ke Atas) */
        #nav-controls {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 6px 0 2px 0;
        }

        .nav-btn {
            flex: 1;
            background: #C62828;
            color: white;
            border: 2px solid #FFF;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .nav-btn:active {
            transform: scale(0.96);
        }

        .nav-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* 3. Halaman Kertas Buku Iqro Penuh sampai Bawah */
        #iqro-page-wrapper {
            background: #FFFDF7;
            width: 100%;
            max-width: 380px;
            flex: 1;
            border-radius: 18px;
            padding: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            border: 4px solid #C62828;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Banner Petunjuk Buku Iqro */
        .iqro-title-banner {
            background: #FFEBEE;
            border: 2px solid #EF5350;
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #B71C1C;
            margin-bottom: 8px;
        }

        /* Grid Baris Kotak Ejaan (Diperbesar) */
        .iqro-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* Pembagian vertikal presisi */
            gap: 6px;
            direction: rtl; /* Teks Arab Kanan ke Kiri */
        }

        .iqro-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        .iqro-box {
            flex: 1;
            height: 100%;
            background: #FFFFFF;
            border: 2px solid #212121;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px; /* Ukuran Huruf Arab Diperbesar */
            font-weight: bold;
            color: #000000;
            font-family: 'Traditional Arabic', 'Scheherazade New', 'Amiri', serif;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .iqro-box:active, .iqro-box.active {
            background-color: #FFE082 !important;
            transform: scale(0.96);
            border-color: #C62828;
        }

        /* Overlay Kenaikan Iqro */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(239, 235, 233, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .overlay.hidden {
            display: none !important;
        }

        .overlay-card {
            background: white;
            padding: 25px 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 5px solid #C62828;
            width: 92%;
            max-width: 360px;
        }

        .title {
            font-size: 26px;
            color: #C62828;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 15px;
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Header Utama -->
    <div id="header">
        <div class="pill-box">📖 IQRO 1</div>
        <div class="pill-box" id="pageNumberDisplay">Halaman 1</div>
    </div>

    <!-- Tombol Navigasi Atas (Sebelumnya & Next) -->
    <div id="nav-controls">
        <button class="nav-btn" id="prevPageBtn">◀ SEBELUMNYA</button>
        <button class="nav-btn" id="nextPageBtn">HALAMAN NEXT ▶</button>
    </div>

    <!-- Halaman Kertas Buku Iqro (Besar Penuh) -->
    <div id="iqro-page-wrapper">
        <div class="iqro-title-banner" id="pageHintBanner">
            BACAAN LANGSUNG: A - BA (TIDAK EJA)
        </div>

        <!-- Grid Ejaan Baris demi Baris -->
        <div class="iqro-grid" id="iqroGrid"></div>
    </div>

    <!-- Screen Kenaikan / Tamat Iqro 1 -->
    <div id="win-overlay" class="overlay hidden">
        <div class="overlay-card">
            <div style="font-size: 60px; margin-bottom: 8px;">🏆</div>
            <div class="title">ALHAMDULILLAH!</div>
            <div class="subtitle">Anak pintar sudah menyelesaikan membaca Buku Iqro 1! 🎉</div>
            
            <button class="nav-btn" id="restartIqroBtn" style="width: 100%; padding: 14px;">ULANGI DARI HALAMAN 1 🔄</button>
        </div>
    </div>
</div>

<script>
    // Data Isi Lembaran Buku Iqro 1
    const iqroPages = [
        {
            page: 1,
            hint: "BACAAN LANGSUNG: A - BA",
            rows: [
                ["أَ", "بَ"],
                ["أَ", "بَ", "أَ"],
                ["بَ", "أَ", "بَ"],
                ["أَ", "أَ", "بَ"],
                ["بَ", "بَ", "أَ"],
                ["أَ", "بَ", "أَ", "بَ"]
            ]
        },
        {
            page: 2,
            hint: "PELAJARAN: TA",
            rows: [
                ["تَ", "بَ", "أَ"],
                ["أَ", "تَ", "بَ"],
                ["بَ", "تَ", "أَ"],
                ["تَ", "أَ", "بَ"],
                ["أَ", "بَ", "تَ"],
                ["أَ", "بَ", "تَ", "أَ"]
            ]
        },
        {
            page: 3,
            hint: "PELAJARAN: TSA",
            rows: [
                ["ثَ", "تَ", "بَ"],
                ["أَ", "ثَ", "بَ"],
                ["ثَ", "بَ", "تَ"],
                ["تَ", "ثَ", "أَ"],
                ["أَ", "بَ", "تَ", "ثَ"],
                ["ثَ", "تَ", "بَ", "أَ"]
            ]
        },
        {
            page: 4,
            hint: "PELAJARAN: JA",
            rows: [
                ["جَ", "ثَ", "تَ"],
                ["جَ", "أَ", "بَ"],
                ["تَ", "جَ", "ثَ"],
                ["بَ", "جَ", "أَ"],
                ["أَ", "بَ", "تَ", "ثَ", "جَ"],
                ["جَ", "ثَ", "تَ", "بَ", "أَ"]
            ]
        },
        {
            page: 5,
            hint: "PELAJARAN: HA",
            rows: [
                ["حَ", "جَ", "ثَ"],
                ["حَ", "أَ", "بَ"],
                ["جَ", "حَ", "تَ"],
                ["ثَ", "حَ", "جَ"],
                ["أَ", "بَ", "تَ", "ثَ", "جَ", "حَ"],
                ["حَ", "جَ", "ثَ", "تَ", "بَ", "أَ"]
            ]
        }
    ];

    let currentPageIdx = 0;
    let audioCtx = null;

    const pageNumberDisplay = document.getElementById('pageNumberDisplay');
    const pageHintBanner = document.getElementById('pageHintBanner');
    const iqroGrid = document.getElementById('iqroGrid');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const winOverlay = document.getElementById('win-overlay');
    const restartIqroBtn = document.getElementById('restartIqroBtn');

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playPopNote() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } catch (e) {}
    }

    // Mengucapkan Ejaan Arab dengan Voice Native Bahasa Arab (ar-SA)
    function speakArabicText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.75;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderPage(idx) {
        const pageData = iqroPages[idx];
        pageNumberDisplay.innerText = `Halaman ${pageData.page}`;
        pageHintBanner.innerText = pageData.hint;

        iqroGrid.innerHTML = '';

        pageData.rows.forEach(rowItems => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'iqro-row';

            rowItems.forEach(itemText => {
                const box = document.createElement('div');
                box.className = 'iqro-box';
                box.innerText = itemText;

                box.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    initAudio();
                    playPopNote();
                    
                    box.classList.add('active');
                    setTimeout(() => box.classList.remove('active'), 250);

                    speakArabicText(itemText);
                });

                rowDiv.appendChild(box);
            });

            iqroGrid.appendChild(rowDiv);
        });

        // Toggle Tombol Navigasi
        if (idx === 0) {
            prevPageBtn.classList.add('disabled');
        } else {
            prevPageBtn.classList.remove('disabled');
        }

        if (idx === iqroPages.length - 1) {
            nextPageBtn.innerText = "SELESAI 🏆";
        } else {
            nextPageBtn.innerText = "HALAMAN NEXT ▶";
        }
    }

    function nextPage() {
        initAudio();
        if (currentPageIdx < iqroPages.length - 1) {
            currentPageIdx++;
            renderPage(currentPageIdx);
        } else {
            winOverlay.classList.remove('hidden');
        }
    }

    function prevPage() {
        initAudio();
        if (currentPageIdx > 0) {
            currentPageIdx--;
            renderPage(currentPageIdx);
        }
    }

    // Event Listeners
    nextPageBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); nextPage(); });
    prevPageBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); prevPage(); });

    restartIqroBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        currentPageIdx = 0;
        winOverlay.classList.add('hidden');
        renderPage(0);
    });

    renderPage(0);
</script>
</body>
</html>
