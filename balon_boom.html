<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Balon Boom!</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #ffffff;
            transition: opacity 0.3s ease;
            padding: 20px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: 800;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #d1d8e0;
        }
        .btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #fff;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(253, 160, 133, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            margin: 10px;
            outline: none;
            letter-spacing: 1px;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(253, 160, 133, 0.4);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #333;
            box-shadow: 0 8px 20px rgba(161, 196, 253, 0.4);
        }
        /* HUD Top Bar */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #pauseBtn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .stats-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 80%;
            max-width: 300px;
        }
        .stats-box div {
            margin: 8px 0;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
        <div class="hud-card" id="hudScore">Skor: 0</div>
        <div class="hud-card" id="hudLevel">Level: 1</div>
        <button id="pauseBtn" onclick="togglePause()">❚❚</button>
    </div>

    <div id="menuScreen" class="overlay">
        <h1>BALON BOOM!</h1>
        <p>Pecahkan balon sebanyak mungkin!<br>Hindari bom hitam!</p>
        <button class="btn" onclick="startGame()">MAIN SEKARANG</button>
    </div>

    <div id="pauseScreen" class="overlay hidden">
        <h1>GAME DI-PAUSE</h1>
        <button class="btn" onclick="togglePause()">LANJUTKAN</button>
        <button class="btn btn-secondary" onclick="returnToMenu()">MENU UTAMA</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1>PERMAINAN SELESAI</h1>
        <div class="stats-box">
            <div><span>Skor Akhir:</span> <strong id="finalScore">0</strong></div>
            <div><span>Rekor Terbaik:</span> <strong id="finalBest">0</strong></div>
        </div>
        <button class="btn" onclick="startGame()">MAIN LAGI</button>
        <button class="btn btn-secondary" onclick="returnToMenu()">MENU UTAMA</button>
    </div>
</div>

<script>
    // --- AUDIO SYSTEM (Web Audio API - Offline & Zero CDN) ---
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'bomb') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        } catch (e) {
            console.error(e);
        }
    }

    // --- GAME ENGINE & SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
        width = canvas.width = canvas.parentElement.clientWidth;
        height = canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameState = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER
    let score = 0;
    let level = 1;
    let bestScore = localStorage.getItem('balonBoomBestScore') || 0;
    let balloons = [];
    let particles = [];
    let spawnTimer = 0;
    let spawnInterval = 60; // frames

    const balloonColors = ['#ff6b6b', '#48dbfb', '#1dd1a1', '#feca57', '#ff9ff3', '#54a0ff'];

    class Balloon {
        constructor() {
            this.radius = Math.random() * 18 + 22;
            this.x = Math.random() * (width - this.radius * 2) + this.radius;
            this.y = height + this.radius;
            this.speed = Math.random() * 1.5 + 1.5 + (level * 0.4);
            this.isBomb = Math.random() < 0.15; // 15% chance bomb
            this.color = this.isBomb ? '#2d3436' : balloonColors[Math.floor(Math.random() * balloonColors.length)];
            this.wobbleSpeed = Math.random() * 0.08 + 0.04;
            this.wobbleDist = Math.random() * 20 + 10;
            this.initialX = this.x;
            this.angle = Math.random() * Math.PI * 2;
        }

        update() {
            this.y -= this.speed;
            this.angle += this.wobbleSpeed;
            this.x = this.initialX + Math.sin(this.angle) * this.wobbleDist;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            // Balloon string
            ctx.beginPath();
            ctx.moveTo(0, this.radius);
            ctx.quadraticCurveTo(5, this.radius + 15, 0, this.radius + 25);
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Balloon body
            ctx.beginPath();
            ctx.ellipse(0, 0, this.radius, this.radius * 1.2, 0, 0, Math.PI * 2);
            
            if (this.isBomb) {
                let grad = ctx.createRadialGradient(-5, -5, 2, 0, 0, this.radius);
                grad.addColorStop(0, '#636e72');
                grad.addColorStop(1, '#2d3436');
                ctx.fillStyle = grad;
                ctx.fill();

                // Bomb fuse & skull/cross
                ctx.fillStyle = '#ff4757';
                ctx.font = `${this.radius}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💣', 0, 0);
            } else {
                let grad = ctx.createRadialGradient(-this.radius/3, -this.radius/3, 2, 0, 0, this.radius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, this.color);
                grad.addColorStop(1, shadeColor(this.color, -40));
                ctx.fillStyle = grad;
                ctx.fill();

                // Highlight shine
                ctx.beginPath();
                ctx.ellipse(-this.radius/3, -this.radius/3, this.radius/4, this.radius/6, Math.PI/4, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 6 + 4;
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 6 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = Math.random() * 0.03 + 0.02;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(this.alpha, 0);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function shadeColor(color, percent) {
        let R = parseInt(color.substring(1,3),16);
        let G = parseInt(color.substring(3,5),16);
        let B = parseInt(color.substring(5,7),16);
        R = parseInt(R * (100 + percent) / 100);
        G = parseInt(G * (100 + percent) / 100);
        B = parseInt(B * (100 + percent) / 100);
        R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
        let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
        let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
        let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
        return "#"+RR+GG+BB;
    }

    // --- GAME CONTROL FUNCTIONS ---
    function startGame() {
        initAudio();
        playSound('click');
        score = 0;
        level = 1;
        balloons = [];
        particles = [];
        spawnTimer = 0;
        spawnInterval = 60;
        
        document.getElementById('menuScreen').classList.add('hidden');
        document.getElementById('pauseScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');

        gameState = 'PLAYING';
    }

    function togglePause() {
        initAudio();
        playSound('click');
        if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            document.getElementById('pauseScreen').classList.remove('hidden');
        } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            document.getElementById('pauseScreen').classList.add('hidden');
        }
    }

    function returnToMenu() {
        initAudio();
        playSound('click');
        gameState = 'MENU';
        document.getElementById('pauseScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('menuScreen').classList.remove('hidden');
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        playSound('bomb');
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('balonBoomBestScore', bestScore);
        }
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalBest').innerText = bestScore;
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    // --- TOUCH & CLICK INTERACTION ---
    function handleInteraction(clientX, clientY) {
        if (gameState !== 'PLAYING') return;

        const rect = canvas.getBoundingClientRect();
        const touchX = clientX - rect.left;
        const touchY = clientY - rect.top;

        // Check balloons collision (iterate backwards for top-most)
        for (let i = balloons.length - 1; i >= 0; i--) {
            let b = balloons[i];
            let dist = Math.hypot(touchX - b.x, touchY - b.y);
            if (dist < b.radius + 10) {
                if (b.isBomb) {
                    gameOver();
                    return;
                } else {
                    playSound('pop');
                    score += 1;
                    // Level progression every 10 points
                    level = Math.floor(score / 10) + 1;
                    spawnInterval = Math.max(25, 60 - (level * 3));

                    // Create particles
                    for (let p = 0; p < 12; p++) {
                        particles.push(new Particle(b.x, b.y, b.color));
                    }

                    balloons.splice(i, 1);
                    break;
                }
            }
        }
    }

    window.addEventListener('pointerdown', (e) => {
        handleInteraction(e.clientX, e.clientY);
    });

    // --- MAIN GAME LOOP ---
    function update() {
        if (gameState !== 'PLAYING') return;

        // HUD Update
        document.getElementById('hudScore').innerText = `Skor: ${score}`;
        document.getElementById('hudLevel').innerText = `Level: ${level}`;

        // Spawn balloons
        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
            balloons.push(new Balloon());
            spawnTimer = 0;
        }

        // Update balloons
        for (let i = balloons.length - 1; i >= 0; i--) {
            balloons[i].update();
            // Remove if off screen
            if (balloons[i].y < -50) {
                balloons.splice(i, 1);
            }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        // Draw background subtle clouds/bubbles
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.beginPath();
        ctx.arc(width * 0.2, height * 0.3, 80, 0, Math.PI * 2);
        ctx.arc(width * 0.8, height * 0.7, 120, 0, Math.PI * 2);
        ctx.fill();

        // Draw balloons
        for (let b of balloons) {
            b.draw();
        }

        // Draw particles
        for (let p of particles) {
            p.draw();
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // Start loop
    requestAnimationFrame(loop);

    // Handle Hardware Back Button simulation / History handling
    window.addEventListener('popstate', (event) => {
        if (gameState === 'PLAYING') {
            togglePause();
            history.pushState(null, '', window.location.href);
        } else if (gameState === 'PAUSED') {
            returnToMenu();
        }
    });
    history.pushState(null, '', window.location.href);
</script>

</body>
</html>
