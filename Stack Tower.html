<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08152e">
<title>Stack Tower</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08152e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;border:0}
.app{width:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
background:radial-gradient(70% 55% at 50% 0%,#214b78 0,#112b50 34%,#08152e 75%,#050b1d 100%)}
.top{padding:calc(env(safe-area-inset-top) + 9px) 14px 7px;display:flex;align-items:center;gap:9px}
.btn{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.08);border:1px solid rgba(125,215,255,.25);display:grid;place-items:center;font-size:20px}
.title{flex:1;font-size:21px;font-weight:900;letter-spacing:.2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:3px 14px 7px}
.stat{background:rgba(7,20,47,.58);border:1px solid rgba(125,215,255,.2);border-radius:14px;padding:7px;text-align:center}
.stat small{display:block;color:#92a9cf;font-size:9px;letter-spacing:1px}.stat b{font-size:16px}
.gameWrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:3px 12px 7px}
.game{position:relative;width:min(94vw,520px);height:min(68vh,590px);border-radius:25px;overflow:hidden;background:#071329;
border:1px solid rgba(102,211,255,.3);box-shadow:0 18px 55px rgba(0,0,0,.34)}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;background:rgba(3,10,27,.70);backdrop-filter:blur(7px)}
.overlay.hide{display:none}.panel{max-width:310px}.panel h1{font-size:34px;margin:0 0 7px}.panel p{color:#a9bad9;margin:0 0 18px}
.primary{padding:13px 23px;border-radius:16px;background:linear-gradient(135deg,#7b52ff,#25d7ff);font-weight:900;box-shadow:0 10px 30px rgba(48,180,255,.22)}
.tip{text-align:center;color:#8fa7cf;font-size:11px;padding:2px 14px 5px}
.bottom{display:flex;justify-content:center;gap:8px;padding:4px 14px calc(env(safe-area-inset-bottom) + 9px)}
.control{padding:10px 17px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(125,215,255,.2);font-weight:800;font-size:12px}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <button class="btn" id="back">‹</button><div class="title">STACK TOWER</div>
  <button class="btn" id="sound">🔊</button><button class="btn" id="music">♫</button>
 </div>
 <div class="stats">
  <div class="stat"><small>TINGGI</small><b id="score">0</b></div>
  <div class="stat"><small>BEST</small><b id="best">0</b></div>
  <div class="stat"><small>COMBO</small><b id="combo">0</b></div>
 </div>
 <div class="gameWrap">
  <div class="game" id="gameBox">
   <canvas id="cv"></canvas>
   <div class="overlay" id="menu">
    <div class="panel"><h1>STACK TOWER</h1><p>Jatuhkan balok tepat di atas balok sebelumnya. Semakin tinggi, semakin cepat.</p><button class="primary" id="start">MULAI</button></div>
   </div>
   <div class="overlay hide" id="end">
    <div class="panel"><h1>MENARA RUNTUH</h1><p id="result"></p><button class="primary" id="again">COBA LAGI</button></div>
   </div>
  </div>
 </div>
 <div class="tip">Ketuk layar saat balok tepat di atas menara</div>
 <div class="bottom"><button class="control" id="pause">⏸ Jeda</button><button class="control" id="reset">↻ Ulang</button></div>
</div>
<script>
(()=>{"use strict";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),box=document.getElementById("gameBox");
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,running=false,paused=false,last=0,score=0,best=+localStorage.stackBest||0,combo=0,dir=1,x=0,speed=170,blocks=[],particles=[],audio=null,musicTimer=null,soundOn=true,musicOn=true;

$("best").textContent=best;
function resize(){let r=box.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=Math.floor(r.width);H=Math.floor(r.height);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!blocks.length)x=W/2}
addEventListener("resize",resize);resize();

function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();return audio}
function tone(f,d=.08,type="sine",v=.028){if(!soundOn)return;try{let a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function music(){clearInterval(musicTimer);if(!musicOn)return;let notes=[196,247,294,330,392,330,294,247],i=0;musicTimer=setInterval(()=>{if(running&&!paused)tone(notes[i++%notes.length],.10,"triangle",.008)},560)}
function drawBg(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0d2a50");g.addColorStop(1,"#050d20");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let i=0;i<30;i++){let sx=(i*83)%W,sy=(i*127)%H;ctx.globalAlpha=.18+(i%3)*.08;ctx.fillStyle="#8de8ff";ctx.beginPath();ctx.arc(sx,sy,1+(i%2),0,7);ctx.fill()}ctx.globalAlpha=1;
 // guide
 ctx.strokeStyle="rgba(125,215,255,.12)";ctx.lineWidth=1;for(let y=H-60;y>20;y-=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function blockColor(i){let h=(195+i*29)%360;return `hsl(${h} 82% 58%)`}
function drawBlock(b){
 let g=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);g.addColorStop(0,blockColor(b.i));g.addColorStop(1,`hsl(${(195+b.i*29+35)%360} 85% 62%)`);
 ctx.fillStyle=g;ctx.shadowBlur=14;ctx.shadowColor=blockColor(b.i);ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,9);ctx.fill();ctx.shadowBlur=0;
 ctx.strokeStyle="rgba(255,255,255,.23)";ctx.stroke();
}
function draw(){
 drawBg();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
 for(const b of blocks)drawBlock(b);
 if(running&&!paused&&blocks.length){let b=blocks[blocks.length-1];drawBlock({x:x-b.w/2,y:b.y-b.h,w:b.w,h:b.h,i:b.i+1})}
}
function reset(){
 running=true;paused=false;score=0;combo=0;speed=170;dir=1;particles=[];blocks=[];
 let w=Math.min(210,W*.58),h=28;blocks.push({x:W/2-w/2,y:H-55,w,h,i:0});x=W/2;last=performance.now();
 $("score").textContent=0;$("combo").textContent=0;$("pause").textContent="⏸ Jeda";$("menu").classList.add("hide");$("end").classList.add("hide");music();tone(440,.1,"sine",.03);requestAnimationFrame(loop)
}
function place(){
 if(!running||paused)return;
 let base=blocks[blocks.length-1], w=Math.min(210,W*.58), current={x:x-w/2,y:base.y-34,w,h:28,i:blocks.length};
 let left=Math.max(current.x,base.x),right=Math.min(current.x+w,base.x+base.w),over=right-left;
 if(over<=5){finish();return}
 current.x=left;current.w=over;blocks.push(current);score++;combo++;speed=Math.min(360,170+score*6);$("score").textContent=score;$("combo").textContent=combo;
 for(let i=0;i<7;i++)particles.push({x:left+Math.random()*over,y:current.y+14,vx:(Math.random()-.5)*80,vy:-50-Math.random()*90,life:1,r:2+Math.random()*3,c:blockColor(current.i)});
 tone(330+Math.min(score,20)*18,.08,"triangle",.03);
 if(score>best){best=score;localStorage.stackBest=best;$("best").textContent=best}
 if(current.y<80){let shift=H*.23;for(const b of blocks)b.y+=shift}
 x=dir>0?W+current.w: -current.w;
}
function finish(){running=false;clearInterval(musicTimer);tone(90,.25,"sawtooth",.04);$("result").textContent=`Tinggi ${score} balok • Best ${best}`;$("end").classList.remove("hide")}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.035);last=t;if(!paused){x+=dir*speed*dt;let w=blocks[blocks.length-1].w;if(x>W+w/2){dir=-1;x=W+w/2}if(x<-w/2){dir=1;x=-w/2}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}}draw();requestAnimationFrame(loop)}
cv.addEventListener("pointerdown",()=>{try{ac()}catch(e){};place()});
$("start").onclick=()=>reset();$("again").onclick=()=>reset();$("reset").onclick=()=>reset();
$("pause").onclick=()=>{if(!running)return;paused=!paused;$("pause").textContent=paused?"▶ Lanjut":"⏸ Jeda";tone(paused?220:520,.07)};
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊":"🔇";if(soundOn)tone(660,.07)};
$("music").onclick=()=>{musicOn=!musicOn;$("music").textContent=musicOn?"♫":"×";music()};
$("back").onclick=()=>{if(history.length>1)history.back();else location.href="about:blank"};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running){paused=true;$("pause").textContent="▶ Lanjut"}});
draw();
})();
</script>
</body>
</html>
