<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tebak Warna & Bentuk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        :root {
            --sat: env(safe-area-inset-top, 10px);
            --sab: env(safe-area-inset-bottom, 20px);
            --sal: env(safe-area-inset-left, 10px);
            --sar: env(safe-area-inset-right, 10px);
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, #FFF5EB 0%, #E8F5E9 100%);
            font-family: 'Fredoka One', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        #game-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding-top: calc(var(--sat) + 10px);
            padding-bottom: calc(var(--sab) + 55px); /* Jarak aman navigasi HP */
            padding-left: calc(var(--sal) + 12px);
            padding-right: calc(var(--sar) + 12px);
        }

        /* Top Header */
        #header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pill-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 14px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            color: #FF4081;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 2px solid #FFF;
        }

        .home-btn {
            background: #FFD166;
            border: 2px solid #FFF;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        /* Prompt Box */
        #prompt-box {
            background: #FFFFFF;
            width: 100%;
            max-width: 380px;
            padding: 16px 15px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border: 4px solid #FFD166;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #prompt-instruction {
            font-size: 24px;
            color: #073B4C;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sound-replay-btn {
            background: #4ECDC4;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.12);
            cursor: pointer;
            margin-top: 4px;
        }

        .sound-replay-btn:active {
            transform: scale(0.95);
        }

        /* Cards Container */
        #cards-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .card {
            flex: 1;
            height: 120px;
            max-width: 110px;
            min-width: 0;
            background: #FFFFFF;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 0px #CBD5E1, 0 8px 12px rgba(0,0,0,0.12);
            border: 3px solid #FFF;
            cursor: pointer;
            padding: 12px;
            transition: transform 0.08s ease;
        }

        .card svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.15));
        }

        .card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #CBD5E1, 0 4px 6px rgba(0,0,0,0.12);
        }

        /* Overlays (Menu & Ending) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(255, 224, 178, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .overlay.hidden {
            display: none !important;
        }

        .overlay-card {
            background: white;
            padding: 25px 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 5px solid #FFD166;
            width: 92%;
            max-width: 360px;
        }

        .title {
            font-size: 26px;
            color: #FF4081;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }

        .menu-btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .mode-btn {
            background: #FF4081;
            color: white;
            border: 3px solid #FFF;
            padding: 14px 18px;
            font-size: 19px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.18);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-btn.secondary {
            background: #06D6A0;
        }

        .mode-btn.accent {
            background: #118AB2;
        }

        .mode-btn:active {
            transform: scale(0.96);
        }

        /* Animations */
        @keyframes correctBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .anim-correct {
            animation: correctBounce 0.4s ease;
            background: #C7F9CC !important;
            border-color: #57CC99 !important;
        }

        .anim-wrong {
            animation: wrongShake 0.4s ease;
            background: #FFCCD5 !important;
            border-color: #FF4D6D !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Header -->
    <div id="header">
        <button class="home-btn" id="homeBtn" title="Menu Utama">🏠 Menu</button>
        <div class="pill-box" id="roundDisplay">Ronde: 1/10</div>
        <div class="pill-box" id="starDisplay">⭐ 0</div>
    </div>

    <!-- Kotak Petunjuk -->
    <div id="prompt-box">
        <div id="prompt-instruction">Cari Bintang Kuning!</div>
        <button class="sound-replay-btn" id="replaySoundBtn">🔊 Dengar Suara</button>
    </div>

    <!-- Pilihan Kartu Gambar -->
    <div id="cards-container"></div>

    <!-- Screen Halaman Menu Utama -->
    <div id="start-overlay" class="overlay">
        <div class="overlay-card">
            <div class="title">🎨 Warna & Bentuk ⭐</div>
            <div class="subtitle">Pilih mode permainan:</div>
            
            <div class="menu-btn-group">
                <button class="mode-btn" id="modeColorBtn">
                    🎨 Tebak Warna
                </button>
                <button class="mode-btn secondary" id="modeShapeBtn">
                    ⭐ Tebak Bentuk
                </button>
                <button class="mode-btn accent" id="modeBothBtn">
                    🎨⭐ Warna & Bentuk
                </button>
            </div>
        </div>
    </div>

    <!-- Screen ENDING -->
    <div id="win-overlay" class="overlay hidden">
        <div class="overlay-card">
            <div style="font-size: 60px; margin-bottom: 8px;">🏆</div>
            <div class="title" style="color: #06D6A0;">HORE! SELESAI!</div>
            <div class="subtitle">Kamu pintar sekali, semua tebakan benar! 🎉</div>
            
            <div class="menu-btn-group">
                <button class="mode-btn" id="restartBtn">MAIN LAGI 🔄</button>
                <button class="mode-btn secondary" id="winHomeBtn">MENU UTAMA 🏠</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Data Warna
    const colorList = [
        { id: 'Merah', hex: '#FF3B30' },
        { id: 'Kuning', hex: '#FFCC00' },
        { id: 'Hijau', hex: '#34C759' },
        { id: 'Biru', hex: '#007AFF' },
        { id: 'Pink', hex: '#FF2D55' },
        { id: 'Ungu', hex: '#AF52DE' },
        { id: 'Oranye', hex: '#FF9500' }
    ];

    // Data Bentuk (Generator SVG)
    const shapeList = [
        { 
            id: 'Lingkaran', 
            svg: (color) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="${color}"/></svg>` 
        },
        { 
            id: 'Kotak', 
            svg: (color) => `<svg viewBox="0 0 100 100"><rect x="12" y="12" width="76" height="76" rx="14" fill="${color}"/></svg>` 
        },
        { 
            id: 'Segitiga', 
            svg: (color) => `<svg viewBox="0 0 100 100"><polygon points="50,10 92,86 8,86" rx="8" fill="${color}"/></svg>` 
        },
        { 
            id: 'Bintang', 
            svg: (color) => `<svg viewBox="0 0 100 100"><polygon points="50,8 63,36 93,38 70,58 78,88 50,70 22,88 30,58 7,38 37,36" fill="${color}"/></svg>` 
        },
        { 
            id: 'Hati', 
            svg: (color) => `<svg viewBox="0 0 100 100"><path d="M50 88 C20 60 5 40 18 20 C30 5 45 20 50 32 C55 20 70 5 82 20 C95 40 80 60 50 88 Z" fill="${color}"/></svg>` 
        }
    ];

    let gameMode = 'both'; // 'color', 'shape', 'both'
    let currentTarget = null;
    let currentRound = 1;
    const maxRounds = 10;
    let stars = 0;
    let isProcessing = false;
    let audioCtx = null;

    // DOM Elements
    const startOverlay = document.getElementById('start-overlay');
    const winOverlay = document.getElementById('win-overlay');
    const modeColorBtn = document.getElementById('modeColorBtn');
    const modeShapeBtn = document.getElementById('modeShapeBtn');
    const modeBothBtn = document.getElementById('modeBothBtn');
    const restartBtn = document.getElementById('restartBtn');
    const winHomeBtn = document.getElementById('winHomeBtn');
    const homeBtn = document.getElementById('homeBtn');
    const replaySoundBtn = document.getElementById('replaySoundBtn');

    const roundDisplay = document.getElementById('roundDisplay');
    const starDisplay = document.getElementById('starDisplay');
    const promptInstruction = document.getElementById('prompt-instruction');
    const cardsContainer = document.getElementById('cards-container');

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playPopNote(freq = 523.25) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    function playWrongSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } catch (e) {}
    }

    function playWinFanfare() {
        if (!audioCtx) return;
        try {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const startTime = audioCtx.currentTime + (idx * 0.12);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.5, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.35);
            });
        } catch (e) {}
    }

    function speakTarget() {
        if ('speechSynthesis' in window && currentTarget) {
            window.speechSynthesis.cancel();
            let text = '';
            if (gameMode === 'color') {
                text = `Cari warna ${currentTarget.color.id}`;
            } else if (gameMode === 'shape') {
                text = `Cari bentuk ${currentTarget.shape.id}`;
            } else {
                text = `Cari ${currentTarget.shape.id} ${currentTarget.color.id}`;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function speakPraise() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const praises = ['Pintar!', 'Hebat!', 'Bagus sekali!', 'Luar biasa!'];
            const randomPraise = praises[Math.floor(Math.random() * praises.length)];
            const utterance = new SpeechSynthesisUtterance(randomPraise);
            utterance.lang = 'id-ID';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function setupRound() {
        isProcessing = false;
        roundDisplay.innerText = `Ronde: ${currentRound}/${maxRounds}`;
        starDisplay.innerText = `⭐ ${stars}`;
        cardsContainer.innerHTML = '';

        // Pilih Target Acak
        const targetColor = colorList[Math.floor(Math.random() * colorList.length)];
        const targetShape = shapeList[Math.floor(Math.random() * shapeList.length)];
        currentTarget = { color: targetColor, shape: targetShape };

        // Tampilkan Instruksi Teks
        if (gameMode === 'color') {
            promptInstruction.innerText = `Cari Warna ${currentTarget.color.id}!`;
        } else if (gameMode === 'shape') {
            promptInstruction.innerText = `Cari Bentuk ${currentTarget.shape.id}!`;
        } else {
            promptInstruction.innerText = `Cari ${currentTarget.shape.id} ${currentTarget.color.id}!`;
        }

        // Buat 3 Pilihan Kartu
        let choices = [currentTarget];

        while (choices.length < 3) {
            const randomColor = colorList[Math.floor(Math.random() * colorList.length)];
            const randomShape = shapeList[Math.floor(Math.random() * shapeList.length)];
            const candidate = { color: randomColor, shape: randomShape };

            // Pengecekan unik berdasarkan mode
            let isDuplicate = false;
            if (gameMode === 'color') {
                isDuplicate = choices.some(c => c.color.id === candidate.color.id);
            } else if (gameMode === 'shape') {
                isDuplicate = choices.some(c => c.shape.id === candidate.shape.id);
            } else {
                isDuplicate = choices.some(c => c.color.id === candidate.color.id && c.shape.id === candidate.shape.id);
            }

            if (!isDuplicate) {
                choices.push(candidate);
            }
        }

        // Acak Posisi
        choices.sort(() => Math.random() - 0.5);

        // Render Kartu Ke Layar
        choices.forEach((choice) => {
            const card = document.createElement('div');
            card.className = 'card';

            // Jika mode tebak warna, semua bentuk dibuat lingkaran
            const shapeToDraw = gameMode === 'color' ? shapeList[0] : choice.shape;
            // Jika mode tebak bentuk, semua warna dibuat biru netral agar anak fokus ke bentuk
            const colorToDraw = gameMode === 'shape' ? '#007AFF' : choice.color.hex;

            card.innerHTML = shapeToDraw.svg(colorToDraw);

            card.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                initAudio();
                handleChoice(card, choice);
            });

            cardsContainer.appendChild(card);
        });

        setTimeout(() => speakTarget(), 200);
    }

    function handleChoice(cardElement, selected) {
        if (isProcessing) return;

        let isCorrect = false;
        if (gameMode === 'color') {
            isCorrect = selected.color.id === currentTarget.color.id;
        } else if (gameMode === 'shape') {
            isCorrect = selected.shape.id === currentTarget.shape.id;
        } else {
            isCorrect = (selected.color.id === currentTarget.color.id && selected.shape.id === currentTarget.shape.id);
        }

        if (isCorrect) {
            isProcessing = true;
            cardElement.classList.add('anim-correct');
            playPopNote(783.99);
            speakPraise();

            stars += 1;
            starDisplay.innerText = `⭐ ${stars}`;

            setTimeout(() => advanceRound(), 1200);
        } else {
            cardElement.classList.add('anim-wrong');
            playWrongSound();
            setTimeout(() => cardElement.classList.remove('anim-wrong'), 400);
        }
    }

    function advanceRound() {
        if (currentRound < maxRounds) {
            currentRound++;
            setupRound();
        } else {
            showWinScreen();
        }
    }

    function showWinScreen() {
        playWinFanfare();
        winOverlay.classList.remove('hidden');
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance("Hore! Kamu hebat sekali, semua berhasil ditebak!");
            utterance.lang = 'id-ID';
            window.speechSynthesis.speak(utterance);
        }
    }

    function showMainMenu() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        startOverlay.classList.remove('hidden');
        winOverlay.classList.add('hidden');
    }

    function startGame(mode) {
        initAudio();
        gameMode = mode;
        currentRound = 1;
        stars = 0;
        startOverlay.classList.add('hidden');
        winOverlay.classList.add('hidden');
        setupRound();
    }

    // Event Listeners
    modeColorBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame('color'); });
    modeShapeBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame('shape'); });
    modeBothBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame('both'); });

    restartBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame(gameMode); });
    winHomeBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); showMainMenu(); });
    homeBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); showMainMenu(); });

    replaySoundBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        initAudio();
        speakTarget();
    });
</script>
</body>
</html>
